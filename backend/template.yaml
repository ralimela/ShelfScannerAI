AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ShelfScannerAI Phase 1 + 2 + 3 - Vision pipeline, user memory layer, vector search,
  and the recommendation engine.
  S3 -> Lambda -> Rekognition DetectText -> Open Library enrichment (Phase 1).
  DynamoDB (Users/Books/ReadingHistory) + Aurora Serverless v2 pgvector via RDS Data API,
  Bedrock Claude (signal extraction) + Titan Embeddings (Phase 2).
  Scan-anchored recommendations against personal history, with a curated catalog
  (catalog_embeddings) bootstrapping cold-start users via onboarding preferences (Phase 3).
  Reading-pace timer sessions feeding a rolling pages-per-hour average into the
  recommendation engine's completion-time estimates (Phase 4).
  Cognito-backed sign-up/login with a claim flow that migrates an anonymous
  guest's taste profile, reading history, and pace sessions onto their new
  account (Phase 5).

Parameters:
  Stage:
    Type: String
    Default: dev

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12

Resources:
  ShelfImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub shelfscannerai-images-${Stage}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfter7Days
            Status: Enabled
            ExpirationInDays: 7

  UploadHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub shelfscannerai-upload-handler-${Stage}
      CodeUri: upload_handler/
      Handler: app.lambda_handler
      Layers:
        # Pillow has a compiled C extension - building it locally on Windows
        # without Docker would bundle incompatible binaries for Lambda's
        # Linux runtime. Using a verified public layer instead of vendoring
        # it ourselves (Klayers project, python3.12, us-east-1, confirmed
        # via `aws lambda get-layer-version` before adding this).
        - arn:aws:lambda:us-east-1:770693421928:layer:Klayers-p312-pillow:2
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref ShelfImagesBucket
          BEDROCK_HAIKU_MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0
          BEDROCK_REGION: !Ref AWS::Region
      Policies:
        - Statement:
            - Sid: PutAndGetShelfImages
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::shelfscannerai-images-${Stage}/*
            - Sid: RekognitionDetectText
              Effect: Allow
              Action:
                - rekognition:DetectText
              Resource: '*'
            - Sid: BedrockInvokeHaikuViaInferenceProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
            - Sid: BedrockInvokeHaikuUnderlyingModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
      Events:
        UploadApi:
          Type: Api
          Properties:
            Path: /upload
            Method: post
            RestApiId: !Ref ShelfScannerApi

  # ---------------------------------------------------------------------
  # Phase 2 - DynamoDB user memory layer (schema: handoff.md section 6)
  # ---------------------------------------------------------------------

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub shelfscannerai-users-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  BooksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub shelfscannerai-books-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bookId
          AttributeType: S
      KeySchema:
        - AttributeName: bookId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ReadingHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub shelfscannerai-reading-history-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ScanSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub shelfscannerai-scan-sessions-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      # Added for Phase 5 (account claiming): every item already carried a userId
      # attribute but had no way to look up a user's sessions other than a full
      # table Scan. This GSI is what lets the claim flow re-key a guest's scan
      # sessions onto their new account with a Query instead of a Scan.
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  PaceSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub shelfscannerai-pace-sessions-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE

  # ---------------------------------------------------------------------
  # Phase 2 - Aurora Serverless v2 (pgvector) reached only via RDS Data
  # API. Lambdas never join this VPC; it exists solely so Aurora has a
  # subnet group. See ShelfScannerAI_Handoff.md section 15 for the cost
  # tradeoffs of this choice (CloudFormation floors MinCapacity at 0.5
  # ACU - no scale-to-zero - so this runs ~$44/mo unless manually
  # stopped between sessions via `aws rds stop-db-cluster`).
  # ---------------------------------------------------------------------

  AuroraVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  AuroraSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AuroraVpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  AuroraSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AuroraVpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  AuroraSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Aurora Serverless v2 (Data API only - no VPC-attached Lambda)
      SubnetIds:
        - !Ref AuroraSubnetA
        - !Ref AuroraSubnetB

  AuroraSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora cluster SG - no ingress rules needed, all access is via RDS Data API
      VpcId: !Ref AuroraVpc
      SecurityGroupIngress: []

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineMode: provisioned
      EngineVersion: '16.9'
      DatabaseName: shelfscanner
      MasterUsername: shelfscanner_admin
      ManageMasterUserPassword: true
      EnableHttpEndpoint: true
      DBSubnetGroupName: !Ref AuroraSubnetGroup
      VpcSecurityGroupIds:
        - !Ref AuroraSecurityGroup
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      DeletionProtection: false
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref AuroraCluster
      PubliclyAccessible: false

  DbBootstrapFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub shelfscannerai-db-bootstrap-${Stage}
      CodeUri: db_bootstrap/
      Handler: app.lambda_handler
      Timeout: 300
      Environment:
        Variables:
          AURORA_CLUSTER_ARN: !GetAtt AuroraCluster.DBClusterArn
          AURORA_SECRET_ARN: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
          AURORA_DATABASE_NAME: shelfscanner
      Policies:
        - Statement:
            - Sid: DataApiBootstrap
              Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt AuroraCluster.DBClusterArn
            - Sid: DataApiSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn

  AuroraBootstrap:
    Type: Custom::AuroraBootstrap
    DependsOn: AuroraInstance
    Properties:
      ServiceToken: !GetAtt DbBootstrapFunction.Arn
      ClusterArn: !GetAtt AuroraCluster.DBClusterArn
      # CloudFormation only re-invokes a custom resource when one of its own
      # Properties changes - it does not track the backing Lambda's code. Bump
      # this whenever BOOTSTRAP_SQL in db_bootstrap/app.py changes so the new
      # SQL actually runs on the next deploy.
      BootstrapSqlVersion: "3"

  # ---------------------------------------------------------------------
  # Phase 2 - API Lambdas
  # ---------------------------------------------------------------------

  UserProfileHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub shelfscannerai-user-handler-${Stage}
      CodeUri: user_handler/
      Handler: app.lambda_handler
      Environment:
        Variables:
          DYNAMODB_USERS_TABLE: !Ref UsersTable
          DYNAMODB_HISTORY_TABLE: !Ref ReadingHistoryTable
          DYNAMODB_PACE_SESSIONS_TABLE: !Ref PaceSessionsTable
      Policies:
        - Statement:
            - Sid: UsersReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn
            - Sid: HistoryQuery
              Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt ReadingHistoryTable.Arn
            - Sid: PaceSessionsQuery
              Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt PaceSessionsTable.Arn
      Events:
        GetProfile:
          Type: Api
          Properties:
            Path: /user/{userId}/profile
            Method: get
            RestApiId: !Ref ShelfScannerApi
        PostOnboarding:
          Type: Api
          Properties:
            Path: /user/{userId}/onboarding
            Method: post
            RestApiId: !Ref ShelfScannerApi
        GetMeProfile:
          Type: Api
          Properties:
            Path: /me/profile
            Method: get
            RestApiId: !Ref ShelfScannerApi
            Auth:
              Authorizer: CognitoAuthorizer
        PostMeOnboarding:
          Type: Api
          Properties:
            Path: /me/onboarding
            Method: post
            RestApiId: !Ref ShelfScannerApi
            Auth:
              Authorizer: CognitoAuthorizer

  FeedbackHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub shelfscannerai-feedback-handler-${Stage}
      CodeUri: feedback_handler/
      Handler: app.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          DYNAMODB_USERS_TABLE: !Ref UsersTable
          DYNAMODB_BOOKS_TABLE: !Ref BooksTable
          DYNAMODB_HISTORY_TABLE: !Ref ReadingHistoryTable
          BEDROCK_CLAUDE_MODEL_ID: us.anthropic.claude-sonnet-4-6
          BEDROCK_TITAN_EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
          BEDROCK_REGION: !Ref AWS::Region
          AURORA_CLUSTER_ARN: !GetAtt AuroraCluster.DBClusterArn
          AURORA_SECRET_ARN: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
          AURORA_DATABASE_NAME: shelfscanner
      Policies:
        - Statement:
            - Sid: UsersReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn
            - Sid: BooksReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt BooksTable.Arn
            - Sid: HistoryWrite
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ReadingHistoryTable.Arn
            - Sid: BedrockInvokeClaudeViaInferenceProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6
            - Sid: BedrockInvokeClaudeUnderlyingModel
              # Cross-region inference profiles (the "us." prefix) can route the request to any
              # of these backing regions, so the underlying foundation-model ARN needs this
              # wildcard rather than a single !Ref AWS::Region - confirmed by testing a bare
              # on-demand InvokeModel call against the model ID, which AWS now rejects in favor
              # of the inference-profile ID above.
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-6
                - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6
                - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6
            - Sid: BedrockInvokeTitanEmbed
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
            - Sid: DataApiUpsert
              Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt AuroraCluster.DBClusterArn
            - Sid: DataApiSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
      Events:
        PostFeedback:
          Type: Api
          Properties:
            Path: /feedback
            Method: post
            RestApiId: !Ref ShelfScannerApi
        PostMeFeedback:
          Type: Api
          Properties:
            Path: /me/feedback
            Method: post
            RestApiId: !Ref ShelfScannerApi
            Auth:
              Authorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------
  # Phase 3 - Recommendation engine
  # ---------------------------------------------------------------------

  RecommendHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub shelfscannerai-recommend-handler-${Stage}
      CodeUri: recommend_handler/
      Handler: app.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          DYNAMODB_USERS_TABLE: !Ref UsersTable
          DYNAMODB_SCAN_SESSIONS_TABLE: !Ref ScanSessionsTable
          BEDROCK_CLAUDE_MODEL_ID: us.anthropic.claude-sonnet-4-6
          BEDROCK_TITAN_EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
          BEDROCK_REGION: !Ref AWS::Region
          AURORA_CLUSTER_ARN: !GetAtt AuroraCluster.DBClusterArn
          AURORA_SECRET_ARN: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
          AURORA_DATABASE_NAME: shelfscanner
      Policies:
        - Statement:
            - Sid: UsersReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt UsersTable.Arn
            - Sid: ScanSessionsWrite
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ScanSessionsTable.Arn
            - Sid: BedrockInvokeClaudeViaInferenceProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6
            - Sid: BedrockInvokeClaudeUnderlyingModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-6
                - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6
                - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6
            - Sid: BedrockInvokeTitanEmbed
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
            - Sid: DataApiQuery
              Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt AuroraCluster.DBClusterArn
            - Sid: DataApiSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
      Events:
        PostRecommend:
          Type: Api
          Properties:
            Path: /recommend
            Method: post
            RestApiId: !Ref ShelfScannerApi
        PostMeRecommend:
          Type: Api
          Properties:
            Path: /me/recommend
            Method: post
            RestApiId: !Ref ShelfScannerApi
            Auth:
              Authorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------
  # Phase 4 - Reading pace tracking
  # ---------------------------------------------------------------------

  PaceHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub shelfscannerai-pace-handler-${Stage}
      CodeUri: pace_handler/
      Handler: app.lambda_handler
      Environment:
        Variables:
          DYNAMODB_USERS_TABLE: !Ref UsersTable
          DYNAMODB_PACE_SESSIONS_TABLE: !Ref PaceSessionsTable
      Policies:
        - Statement:
            - Sid: UsersReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UsersTable.Arn
            - Sid: PaceSessionsReadWrite
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt PaceSessionsTable.Arn
      Events:
        PostPaceLog:
          Type: Api
          Properties:
            Path: /user/{userId}/pace-log
            Method: post
            RestApiId: !Ref ShelfScannerApi
        PostMePaceLog:
          Type: Api
          Properties:
            Path: /me/pace-log
            Method: post
            RestApiId: !Ref ShelfScannerApi
            Auth:
              Authorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------
  # Phase 5 - Authentication (Cognito) + account claiming
  #
  # Anonymous/guest mode is unchanged: the routes above with no Cognito
  # authorizer keep trusting whatever userId is in the path/body, exactly as
  # before. Every handler above also now accepts a second, parallel route
  # under /me/... that DOES carry a CognitoAuthorizer - API Gateway verifies
  # the bearer token before the Lambda runs and injects the verified claims
  # into event.requestContext.authorizer.claims, which each handler's
  # _resolve_user_id() helper trusts over any path/body userId. No JWT
  # library or custom authorizer Lambda needed - this is native REST API
  # support for Cognito User Pool authorizers.
  #
  # Google sign-in is NOT wired up yet - this account was created without a
  # Google OAuth client, which only the project owner can create (Google
  # Cloud Console). Adding it later is a small, deliberate follow-up (a new
  # AWS::Cognito::UserPoolIdentityProvider plus updating UserPoolClient's
  # SupportedIdentityProviders below), not attempted here since its
  # correctness can't be live-verified without real Google credentials.
  # ---------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub shelfscannerai-users-${Stage}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      # Cognito domain prefixes are globally unique across every AWS account
      # in the region, hence the account id in the name.
      Domain: !Sub shelfscannerai-${AWS::AccountId}-${Stage}
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub shelfscannerai-web-${Stage}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - https://main.d3e1l3syrof2p7.amplifyapp.com/auth/callback
        - http://localhost:3000/auth/callback
      LogoutURLs:
        - https://main.d3e1l3syrof2p7.amplifyapp.com/
        - http://localhost:3000/
      SupportedIdentityProviders:
        - COGNITO

  AuthHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub shelfscannerai-auth-handler-${Stage}
      CodeUri: auth_handler/
      Handler: app.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          DYNAMODB_USERS_TABLE: !Ref UsersTable
          DYNAMODB_HISTORY_TABLE: !Ref ReadingHistoryTable
          DYNAMODB_PACE_SESSIONS_TABLE: !Ref PaceSessionsTable
          DYNAMODB_SCAN_SESSIONS_TABLE: !Ref ScanSessionsTable
          AURORA_CLUSTER_ARN: !GetAtt AuroraCluster.DBClusterArn
          AURORA_SECRET_ARN: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
          AURORA_DATABASE_NAME: shelfscanner
      Policies:
        - Statement:
            - Sid: UsersReadWriteDelete
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt UsersTable.Arn
            - Sid: HistoryReadAndBatchRewrite
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:BatchWriteItem
              Resource: !GetAtt ReadingHistoryTable.Arn
            - Sid: PaceSessionsReadAndBatchRewrite
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:BatchWriteItem
              Resource: !GetAtt PaceSessionsTable.Arn
            - Sid: ScanSessionsQueryByUserIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${ScanSessionsTable.Arn}/index/userId-index
            - Sid: ScanSessionsUpdateByKey
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ScanSessionsTable.Arn
            - Sid: DataApiRekeyEmbeddings
              Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt AuroraCluster.DBClusterArn
            - Sid: DataApiSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
      Events:
        PostMeClaim:
          Type: Api
          Properties:
            Path: /me/claim
            Method: post
            RestApiId: !Ref ShelfScannerApi
            Auth:
              Authorizer: CognitoAuthorizer

  ShelfScannerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET, POST, OPTIONS'"
        AllowHeaders: "'Content-Type, Authorization'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

Outputs:
  ApiBaseUrl:
    Description: Base URL for the ShelfScannerAI API (prod-style stage path)
    Value: !Sub https://${ShelfScannerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UploadEndpoint:
    Description: POST endpoint for bookshelf image upload
    Value: !Sub https://${ShelfScannerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/upload
  UserProfileEndpoint:
    Description: GET endpoint for a user's taste profile
    Value: !Sub https://${ShelfScannerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/user/{userId}/profile
  FeedbackEndpoint:
    Description: POST endpoint for post-read feedback
    Value: !Sub https://${ShelfScannerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/feedback
  RecommendEndpoint:
    Description: POST endpoint for scan-anchored book recommendations
    Value: !Sub https://${ShelfScannerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/recommend
  OnboardingEndpoint:
    Description: POST endpoint for initial taste-profile onboarding
    Value: !Sub https://${ShelfScannerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/user/{userId}/onboarding
  ScanSessionsTableName:
    Description: DynamoDB table logging each scan + recommendation session
    Value: !Ref ScanSessionsTable
  PaceSessionsTableName:
    Description: DynamoDB table logging each reading-pace timer session
    Value: !Ref PaceSessionsTable
  PaceLogEndpoint:
    Description: POST endpoint for logging a reading-pace session
    Value: !Sub https://${ShelfScannerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/user/{userId}/pace-log
  ShelfImagesBucketName:
    Description: S3 bucket storing uploaded bookshelf photos
    Value: !Ref ShelfImagesBucket
  UsersTableName:
    Description: DynamoDB table storing user identity and taste profiles
    Value: !Ref UsersTable
  BooksTableName:
    Description: DynamoDB table caching enriched book metadata
    Value: !Ref BooksTable
  ReadingHistoryTableName:
    Description: DynamoDB table storing per-user reading history and feedback
    Value: !Ref ReadingHistoryTable
  AuroraClusterEndpoint:
    Description: Aurora Serverless v2 cluster writer endpoint (for manual psql/debugging via a bastion - no VPC access from a laptop otherwise)
    Value: !GetAtt AuroraCluster.Endpoint.Address
  AuroraSecretArn:
    Description: Secrets Manager ARN holding Aurora master credentials (used by the RDS Data API)
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
  AuroraClusterArn:
    Description: Aurora Serverless v2 cluster ARN (needed by backend/scripts/ingest_catalog.py)
    Value: !GetAtt AuroraCluster.DBClusterArn
  UserPoolId:
    Description: Cognito User Pool id (needed by the frontend's .env.local)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool app client id (needed by the frontend's .env.local)
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Cognito Hosted UI domain, used for the OAuth2 authorize/token endpoints
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  MeClaimEndpoint:
    Description: POST endpoint that migrates an anonymous guest's data onto the signed-in account
    Value: !Sub https://${ShelfScannerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/me/claim
